    txt('s2', 'GLOBAL SEED VAULT · NORWAY', Wd / 2, top + 36, { size: 42, w: 500, track: 8, col: C.amber, a });

    const [ax, ay, av] = proj(...AIR, .01); if (av) pin('pa', 'AIRPORT', ax, ay, a * seg(t, W('l02', 1.2), W('l02', 1.6)), C.ice, 26, 28);

  { const a = env(t, W('l06', .1), W('l07'), .3, .4); txt('y1', '2015 · SYRIA', Wd / 2, top - 20, { size: 100, w: 600, col: C.rule, a });
