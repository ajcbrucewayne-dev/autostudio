<script type="module">
// North Sentinel Island as an isometric toy diorama: real coastline, beaches and reef (Sentinel-2) as blocks, Kenney jungle,
// faceted cartoon sea, a glowing no-go ring. The Sentinelese are never drawn: only their island, the outsiders and the arrows.
import * as THREE from 'three';

const Wd = innerWidth, Ht = innerHeight, D2R = Math.PI / 180, Q = new URLSearchParams(location.search);

const [D, CUES, ST] = await Promise.all(['assets/diorama.json', 'out/cues.json', 'out/starts.json'].map(u => fetch(u).then(r => r.json())));
const [lon0b, lon1b, lat0b, lat1b] = D.box, [LON0, LAT0] = D.centre, KX = 111.32 * Math.cos(11.55 * D2R), KZ = 111.32;

const CW = .0025 * KX, CH = .0025 * KZ, DUR = 51.5;
const W = (k, f = 0) => ST[k] + f;                                     // line start + offset (s)

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

{ const c = document.createElement('canvas'); c.width = 512; c.height = 1024; const q = c.getContext('2d');

const sun = new THREE.DirectionalLight(0xfff0dc, 2.7); sun.position.set(-40, 70, 30); sun.castShadow = true;

{ const base = new THREE.Mesh(new THREE.BoxGeometry(BW + .6, 2.2, BD + .6), [M(0xe9dcc6), M(0xe9dcc6), M(0xf3ead8), M(0x2b2440), M(0xd8c6a8), M(0xd8c6a8)]);

const gl = new GLTFLoader(); const loadG = u => new Promise((r, e) => gl.load(u, x => r(x.scene), undefined, e)); const KIT = 'assets/kits/';

  { const m = new THREE.Matrix4(); D.cells.forEach(([lo, la], k) => { const p = back(seg(t, cellT[k] * .06, cellT[k] * .06 + .45), 2.2), [x, z] = xz(lo, la), hh = cellH[k] * Math.max(p, .001);
