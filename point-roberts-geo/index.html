const along = u => { const L = rS[rS.length - 1] * u; let i = 1; while (i < rS.length - 1 && rS[i] < L) i++; const f = (L - rS[i - 1]) / (rS[i] - rS[i - 1] || 1); return RT[i - 1].clone().lerp(RT[i], f); };

// ---------- the globe (opening): Blue Marble with bold fills, an atmosphere rim, far from the map ----------
const GC = new THREE.Vector3(90000, 0, 0), RE = 6371, TG = 2.25;
const globeTex = await load('assets/globe_colored.jpg'); globeTex.colorSpace = THREE.SRGBColorSpace; globeTex.anisotropy = 8;
const globe = new THREE.Mesh(new THREE.SphereGeometry(RE, 160, 80), new THREE.ShaderMaterial({ uniforms: { tex: { value: globeTex }, L: { value: new THREE.Vector3(-.5, .45, .75).normalize() } },
  vertexShader: `varying vec2 vUv; varying vec3 vN, vW; void main(){ vUv = uv; vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `varying vec2 vUv; varying vec3 vN, vW; uniform sampler2D tex; uniform vec3 L;
    void main(){ vec3 c = pow(texture2D(tex, vUv).rgb, vec3(2.2)); float d = max(dot(vN, L), 0.); vec3 v = normalize(cameraPosition - vW);
      float rim = pow(1. - max(dot(vN, v), 0.), 3.);
      vec3 col = c * (.28 + 1.25 * d) + vec3(.35, .6, 1.) * rim * (.25 + d) * .9; gl_FragColor = vec4(col, 1.); }` }));
globe.position.copy(GC); scene.add(globe);
const halo = new THREE.Mesh(new THREE.SphereGeometry(RE * 1.035, 96, 48), new THREE.ShaderMaterial({ transparent: true, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vN, vW; void main(){ vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `varying vec3 vN, vW; void main(){ vec3 v = normalize(cameraPosition - vW); float f = pow(1. - abs(dot(vN, v)), 2.2); gl_FragColor = vec4(vec3(.35, .62, 1.) * 1.4, f * .9); }` }));
halo.position.copy(GC); scene.add(halo);
const stars = (() => { const n = 1500, p = new Float32Array(n * 3); let sd = 7; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) { const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = 150000; p.set([GC.x + r * Math.sqrt(1 - u * u) * Math.cos(th), r * u, r * Math.sqrt(1 - u * u) * Math.sin(th)], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const m = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: .8 })); m.frustumCulled = false; scene.add(m); return m; })();
const gdir = (lon, lat) => { const ph = (lon + 180) * D2R, la = lat * D2R; return new THREE.Vector3(-Math.cos(ph) * Math.cos(la), Math.sin(la), Math.sin(ph) * Math.cos(la)); };
function globeCam(t) {
  const u = ss(seg(t, 0, TG)), lon = lerp(-70, -123.06, eio(seg(t, 0, 1.9))), lat = lerp(36, 49.0, eio(seg(t, 0, 1.9)));
  const alt = Math.exp(lerp(Math.log(RE * 2.4), Math.log(1400), Math.pow(seg(t, .3, TG), 1.4)));
  camera.near = 5; camera.far = 400000; camera.updateProjectionMatrix();
  const d = gdir(lon, lat); camera.position.copy(GC).addScaledVector(d, RE + alt); camera.up.set(0, 1, 0);
  const look = GC.clone().addScaledVector(d, RE * lerp(0, 1, ss(seg(t, 1.2, TG)))); camera.lookAt(look); camera.updateMatrixWorld();
  G.camP.value.copy(camera.position); G.resY.value = Ht * SS; dof.maxCoc = 0;
}

// ---------- post ----------
const { composer, dof, bloom } = makePost(renderer, scene, camera, Wd, Ht, { ssaa: SS, ao: false });
bloom.strength = .5; bloom.radius = .45; bloom.threshold = 1.05;

// ---------- camera ----------
function setCam(c) {
  const [X, Z] = xz(c.lon, c.lat), Y = yOf(hAt(c.lon, c.lat)) * .5, th = c.tilt * D2R, hd = c.head * D2R;
  const off = new THREE.Vector3(-Math.sin(hd) * Math.sin(th), Math.cos(th), Math.cos(hd) * Math.sin(th)).multiplyScalar(c.d);
  camera.position.set(X + off.x, Y + off.y, Z + off.z); camera.up.set(0, 1, 0); camera.lookAt(X, Y, Z); camera.updateMatrixWorld();
  G.camP.value.copy(camera.position); G.fogD.value = Math.max(12, c.d * 2.6); G.resY.value = Ht * SS;
  if (FX.dof) { dof.focus = c.d; dof.aper = 420 / c.d; dof.maxCoc = 14; } else dof.maxCoc = 0;
}

// ---------- 2D overlay ----------
const ov = document.createElement('canvas'); ov.width = Wd; ov.height = Ht; ov.style.width = Wd + 'px'; ov.style.height = Ht + 'px'; document.body.appendChild(ov);
const g = ov.getContext('2d');
const proj = (lon, lat, lift = .1, y = null) => { const p = geo(lon, lat, lift); if (y != null) p.y = y; const v = p.project(camera); return [(v.x + 1) / 2 * Wd, (1 - v.y) / 2 * Ht, v.z < 1 && Math.abs(v.x) < 1.15 && Math.abs(v.y) < 1.15]; };
let TX = [];
const C = { amber: '#ffd400', amber2: '#ffd400', ice: '#ffffff', rule: '#ffffff', teal: '#2fa3b0', teal2: '#8fd6de', sea: '#bcdbe6' };
function txt(id, s, x, y, o = {}) {
  const a = o.a ?? 1; if (a <= .01 || !s) return;
  g.save(); g.globalAlpha = a; g.font = `${Math.max(o.w ?? 600, 700)} ${o.size ?? 34}px Barlow`; g.letterSpacing = (o.track ?? 0) + 'px'; g.textAlign = o.align ?? 'center';
  if (o.shadow !== false) { g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = o.blur ?? 14; }
  if (o.stroke !== false) { g.shadowBlur = 0; g.lineJoin = 'round'; g.strokeStyle = 'rgba(0,0,0,.92)'; g.lineWidth = Math.max(4, (o.size ?? 34) * .14); g.strokeText(s, x, y); }
  g.fillStyle = o.col ?? C.rule; g.fillText(s, x, y); const w = g.measureText(s).width; g.restore();
  const x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;
  if (a > .95) TX.push({ id, text: s, x0, y0: y - (o.size ?? 34), x1: x0 + w, y1: y + 6, ...(o.pass ? { pass: true } : {}) });
}
function dot(x, y, r, col, a = 1, ring = 0) { g.save(); g.globalAlpha = a; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 18; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  if (ring > 0) { g.globalAlpha = a * (1 - ring); g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.arc(x, y, r + ring * 70, 0, Math.PI * 2); g.stroke(); } g.restore(); }
function leader(x0, y0, x1, y1, col, a) { g.save(); g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.restore(); }
const env = (t, a, b, fi = .3, fo = .3) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
const fmt = n => Math.round(n).toLocaleString('en-US');

const CUES = []; for (const [id, t0, parts] of LINES) { const d = vdur[id], tot = parts.reduce((a, p) => a + p.length, 0); let s = t0;
  parts.forEach((p, i) => { const dd = d * p.length / tot; CUES.push({ t0: s, t1: s + dd + (i === parts.length - 1 ? .45 : .05), text: p }); s += dd; }); }
function subtitles(t) {
  const c = CUES.find(c => t >= c.t0 - .05 && t < c.t1); if (!c) return;
  const a = Math.min(seg(t, c.t0 - .05, c.t0 + .1), 1 - seg(t, c.t1 - .12, c.t1)), x = 64, y = Ht - 230, size = 44;
  g.save(); const gr = g.createLinearGradient(0, Ht - 380, 0, Ht); gr.addColorStop(0, 'rgba(5,8,12,0)'); gr.addColorStop(1, 'rgba(5,8,12,.62)');
  g.fillStyle = gr; g.globalAlpha = a; g.fillRect(0, Ht - 380, Wd, 380); g.fillStyle = C.amber; g.fillRect(x - 22, y - size + 4, 5, size + 8); g.restore();
  txt('sub', c.text, x, y, { size, w: 600, align: 'left', a, col: '#ffffff', blur: 8 });
}

// events for the mixer
const EV = [{ t: HITS.line0, type: 'ignite' }, { t: HITS.tip, type: 'hit' }, { t: HITS.name, type: 'chime', note: 78 }, { t: HITS.area, type: 'tick2' }, { t: HITS.pop, type: 'tick2' },
  { t: HITS.y1846, type: 'drum' }, { t: HITS.region, type: 'whoosh' }, { t: HITS.par49, type: 'ignite' }, { t: HITS.sliced - .45, type: 'suck' }, { t: HITS.sliced, type: 'hit' }, { t: HITS.side, type: 'chime', note: 81 },
  { t: HITS.drive, type: 'drive', to: HITS.cross2 + .3 }, { t: HITS.drive + .15, type: 'xing' }, { t: HITS.cross2, type: 'xing' }, { t: HITS.bus, type: 'whoosh' },
  { t: HITS.four, type: 'count' }, { t: HITS.y2020 - .5, type: 'suck' }, { t: HITS.y2020, type: 'slam' }, { t: HITS.cutoff, type: 'drum' }, { t: HITS.ask, type: 'resolve' }];
const busU = t => { const k = seg(t, HITS.bus, 39.2); const loop = (k * 2) % 2; return loop < 1 ? ss(loop) : 1 - ss(loop - 1); };     // there and back

// ---------- the frame ----------
function frame(t) {
  TX = [];
  if (t < TG) globeCam(t);
  else { if (camera.far > 1000) { camera.near = .05; camera.far = 2000; camera.updateProjectionMatrix(); }
    setCam(Q.has('cam') ? (([lon, lat, d, tilt, head]) => ({ lon, lat, d, tilt, head }))(Q.get('cam').split(',').map(Number)) : CAM(t)); }
  G.time.value = t; G.lvl.value = 0; water.position.y = 0;
  // the 49th parallel ignites east → west in the hook, flashes again in 1846
  const pr = t < 11 ? eo(seg(t, HITS.line0, HITS.line0 + 2.2)) : 1;
  for (const r of [par.glow, par.core]) { r.u.rev.value = r.L * pr + .01; r.u.inten.value = Math.max(env(t, 0, DUR + 1, .2, .1) * (t > 26.2 && t < 39.6 ? .45 : 1), 0); }
  par.core.u.head.value = par.core.L * pr; par.core.u.headAmt.value = 3 * (1 - seg(t, 2.4, 2.8)) + 3 * Math.sin(Math.PI * seg(t, HITS.par49 - .2, HITS.par49 + .8));
  const tipA = Math.max(seg(t, HITS.tip - .1, HITS.tip + .3), 0) * (1 + .8 * Math.sin(Math.PI * seg(t, HITS.sliced, HITS.sliced + .9)) + .6 * Math.sin(Math.PI * seg(t, HITS.side, HITS.side + .9)));
  G.prI.value = tipA * (t > 26.2 && t < 39.6 ? .55 : 1);
  G.glow.value = Math.min(1, tipA);
  const rv = seg(t, HITS.drive, HITS.cross2 + .2), rA = env(t, HITS.drive - .1, 39.8, .2, .5);
  for (const r of [route.glow, route.core]) { r.u.rev.value = r.L * eo(rv) + .01; r.u.inten.value = rA; }
  route.core.u.head.value = route.core.L * eo(rv); route.core.u.headAmt.value = 2.5 * (1 - seg(t, HITS.cross2 + .2, HITS.cross2 + .5));
  composer.render();

  g.clearRect(0, 0, Wd, Ht);
  { const f = Math.max(0, 1 - Math.abs(t - TG) / .18); if (f > 0) { g.save(); g.globalAlpha = f * .85; g.fillStyle = '#ffffff'; g.fillRect(0, 0, Wd, Ht); g.restore(); } }
  if (Q.has('clean')) return;
  const top = 250;
  // hook: USA → CANADA → USA
  { const a = env(t, HITS.usa - .1, 5.6, .3, .4);
    const parts = [['USA', C.amber2], ['→', C.rule], ['CANADA', C.ice], ['→', C.rule], ['USA', C.amber2]];
    let x = Wd / 2 - 330; parts.forEach(([s, c], i) => { const ai = a * seg(t, HITS.usa + i * .18, HITS.usa + .25 + i * .18); txt('u' + i, s, x, top, { size: 84, w: 600, col: c, a: ai, align: 'left' }); x += [180, 90, 270, 90, 0][i]; }); }
  const lab49 = (id, a, lon) => { const [x, y, v] = proj(lon, 49.0005, .05); if (v) { txt(id, '49TH PARALLEL', x, y - 18, { size: 34, w: 600, track: 8, col: C.amber2, a }); } };
  lab49('p49a', env(t, .9, 5.6, .3, .4), -122.98);
  // name, size, people
  { const [x, y, v] = proj(-123.055, 48.982, .05);
    if (v) { txt('n1', 'POINT ROBERTS', x, y - 120, { size: 64, w: 600, track: 8, a: env(t, HITS.name - .2, 11.9, .3, .4) });
      txt('n2', 'WASHINGTON, USA', x, y - 80, { size: 32, w: 500, track: 8, col: C.amber2, a: env(t, HITS.name, 11.9, .3, .4) }); }
    txt('a1', '12.7 KM²', Wd / 2 - 230, top + 20, { size: 96, w: 600, col: C.rule, a: env(t, HITS.area - .2, 11.9, .3, .4) });
    txt('a1b', 'LAND AREA', Wd / 2 - 230, top + 62, { size: 30, w: 500, track: 8, col: C.ice, a: env(t, HITS.area - .2, 11.9, .3, .4) });
    txt('p1', '1,191', Wd / 2 + 230, top + 20, { size: 96, w: 600, col: C.amber2, a: env(t, HITS.pop - .2, 11.9, .3, .4) });
    txt('p1b', 'PEOPLE (2020)', Wd / 2 + 230, top + 62, { size: 30, w: 500, track: 8, col: C.amber2, a: env(t, HITS.pop - .2, 11.9, .3, .4) });
    const [cx, cy, cv] = proj(-123.0, 49.05, .05); if (cv) txt('ca', 'CANADA', cx, cy, { size: 46, w: 600, track: 14, col: C.ice, a: env(t, 3.0, 19.0, .4, .4) }); }
  // 1846
  txt('y1', '1846', Wd / 2, top + 20, { size: 120, w: 600, col: C.rule, a: env(t, HITS.y1846 - .1, 19.0, .3, .4) });
  txt('y1b', 'OREGON TREATY · A STRAIGHT LINE', Wd / 2, top + 80, { size: 34, w: 500, track: 6, col: C.ice, a: env(t, HITS.y1846 + .3, 19.0, .3, .4) });
  lab49('p49b', env(t, HITS.par49 - .2, 19.0, .3, .4), -122.4);
  { const [x, y, v] = proj(-122.6, 49.25, .05); if (v) txt('cb', 'BRITISH (NOW CANADA)', x, y, { size: 32, w: 600, track: 6, col: C.ice, a: env(t, HITS.par49, 19.0, .3, .4) });
    const [x2, y2, v2] = proj(-122.6, 48.8, .05); if (v2) txt('ub', 'AMERICAN', x2, y2, { size: 32, w: 600, track: 6, col: C.amber2, a: env(t, HITS.par49, 19.0, .3, .4) }); }
  // sliced
  { const [x, y, v] = proj(-123.06, 48.98, .05); const a = env(t, HITS.side - .2, 26.2, .3, .4); if (v) txt('as', 'AMERICAN SIDE', x, y + 70, { size: 44, w: 600, track: 8, col: C.amber2, a }); }
  // the drive
  { const a = env(t, HITS.drive, 33.4, .3, .4), [mx, my, mv] = proj(-122.92, 49.085, .05);
    if (mv) txt('km', '≈40 KM THROUGH CANADA', mx, my - 30, { size: 40, w: 600, track: 4, col: C.rule, a: a * seg(t, HITS.drive + 1.2, HITS.drive + 1.5) });
    const xa = [[XING.tyee, HITS.drive + .15], [XING.peace, HITS.cross2]];
    xa.forEach(([p, tt], i) => { const [x, y, v] = proj(p[0], p[1], .05); const ai = env(t, tt - .1, 39.8, .2, .5); if (v && ai > 0) { dot(x, y, 10, C.amber2, ai, seg(t, tt, tt + 1)); txt('x' + i, 'BORDER', x, y + 52, { size: 28, w: 600, track: 6, col: C.amber2, a: ai, pass: true }); } });
    txt('rs', 'ROUTE SCHEMATIC', Wd - 64, Ht - 280, { size: 22, w: 500, track: 4, col: C.ice, align: 'right', a: env(t, HITS.drive, 39.8, .3, .4), pass: true }); }
  // the school bus: a dot that goes there and back; the counter
  if (t > HITS.bus && t < 39.8) {
    const p = along(busU(t)).project(camera), x = (p.x + 1) / 2 * Wd, y = (1 - p.y) / 2 * Ht; dot(x, y, 12, '#ffd34d', env(t, HITS.bus, 39.6, .2, .3));
    const n = Math.min(4, Math.floor(seg(t, HITS.four - .2, HITS.four + 1.1) * 4.999)), a = env(t, HITS.four - .3, 39.8, .3, .4);
    txt('b1', String(n), Wd / 2, top + 30, { size: 140, w: 600, col: C.amber2, a, pass: true });
    txt('b2', 'BORDER CROSSINGS A DAY', Wd / 2, top + 84, { size: 34, w: 500, track: 6, col: C.amber2, a });
  }
  // 2020: closed
  { const [x, y, v] = proj(XING.tyee[0], XING.tyee[1], .05), a = env(t, HITS.y2020 - .1, 46.0, .2, .5);
    if (v && a > 0) { const k = eo(seg(t, HITS.y2020, HITS.y2020 + .3)); g.save(); g.globalAlpha = a; g.strokeStyle = '#ff5a4f'; g.lineWidth = 12; g.lineCap = 'round';
      const r = 46 * k; g.beginPath(); g.moveTo(x - r, y - r); g.lineTo(x + r, y + r); g.moveTo(x + r, y - r); g.lineTo(x - r, y + r); g.stroke(); g.restore();
      txt('cl', 'BORDER CLOSED', x, y - 80, { size: 48, w: 600, track: 8, col: '#ff7a6f', a }); }
    txt('y2', '2020', Wd / 2, top + 20, { size: 120, w: 600, col: C.rule, a: env(t, HITS.y2020 - .1, 46.0, .3, .4) });
    txt('y2b', 'CUT OFF BY LAND · 1.5+ YEARS', Wd / 2, top + 80, { size: 34, w: 500, track: 6, col: '#ff9a8f', a: env(t, HITS.cutoff - .1, 46.0, .3, .4) }); }
  // ending
  { const a = seg(t, HITS.ask + 1.0, HITS.ask + 1.5);
    txt('e1', 'THE TOWN', Wd / 2, top - 10, { size: 100, w: 600, col: C.rule, a }); txt('e2', "YOU CAN'T DRIVE TO", Wd / 2, top + 90, { size: 84, w: 600, col: C.amber2, a: seg(t, HITS.ask + 1.4, HITS.ask + 1.9) }); }
  subtitles(t);
  txt('src', /*no-stroke*/ 'Imagery: Sentinel-2 cloudless 2016 by EOX (CC BY 4.0) · Terrain: AWS Terrain Tiles · Relief ×2 · Route schematic', Wd / 2, Ht - 36, { size: 20, w: 500, col: 'rgba(230,235,240,.8)', pass: true, blur: 4, stroke: false });
}

await Promise.all([400, 500, 600, 700].map(w => document.fonts.load(`${w} 40px Barlow`))); await document.fonts.ready;
window.DUR = T1 != null ? T1 - T0 : DUR; window.EV = EV;
window.render = t => frame(t + T0);
window.TEXTS = t => { window.render(t); return TX.map(o => ({ ...o })); };
window.render(0); window.READY = true;
</script></body></html>
