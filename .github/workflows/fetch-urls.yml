name: Fetch URLs and map tiles
on:
  push:
    paths: ['assets/url-list.txt']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - name: Download
        run: |
          python3 - <<'PY'
          # lines: "dest|url[|x0,y0,x1,y1]"  or  "tiles|dest_dir|url_template_with_{z}{x}{y}|z|lon0|lat0|lon1|lat1"
          import math, os, time, urllib.request
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          UA = {'User-Agent': 'autostudio-asset-fetch/1.0 (GitHub Actions)'}
          def get(url, path):
              for k in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=120) as r, open(path, 'wb') as f: f.write(r.read())
                      return True
                  except Exception as e:
                      print('retry', url, e); time.sleep(5 * (k + 1))
              return False
          log = open('assets/url-fetch.log', 'a')
          for line in open('assets/url-list.txt'):
              line = line.strip()
              if not line or line.startswith('#'): continue
              p = line.split('|')
              if p[0] == 'tiles':
                  _, dest, tpl, z, lon0, lat0, lon1, lat1 = p; z = int(z); n = 2 ** z; os.makedirs(dest, exist_ok=True)
                  tx = lambda lo: int((float(lo) + 180) / 360 * n)
                  ty = lambda la: int((1 - math.log(math.tan(math.radians(float(la))) + 1 / math.cos(math.radians(float(la)))) / math.pi) / 2 * n)
                  for x in range(tx(lon0), tx(lon1) + 1):
                      for y in range(ty(lat1), ty(lat0) + 1):
                          f = os.path.join(dest, f'{z}_{x}_{y}.jpg')
                          if os.path.exists(f): continue
                          u = tpl.format(z=z, x=x, y=y)
                          if get(u, f): log.write(f'{time.strftime("%Y-%m-%d")} {u}\n')
                          time.sleep(.2)
              else:
                  dest, url = p[0], p[1]; crop = p[2] if len(p) > 2 else ''
                  out = dest if not crop else dest.replace('.jpg', f'_crop.jpg')
                  if os.path.exists(out): continue
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  if not get(url, dest): print('FAILED', url); continue
                  log.write(f'{time.strftime("%Y-%m-%d")} {url}\n')
                  if crop:
                      b = tuple(int(v) for v in crop.split(',')); Image.open(dest).crop(b).convert('RGB').save(out, quality=92); os.remove(dest)
                  print('ok', out, os.path.getsize(out))
          PY
      - name: Commit
        run: |
          git config user.name "autostudio-bot"; git config user.email "bot@users.noreply.github.com"
          git add assets; git commit -m "Fetch URLs and tiles" || echo "nothing new"; git push
