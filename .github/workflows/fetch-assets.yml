name: Fetch free assets
# Downloads public-domain / freely licensed media from Wikimedia Commons into assets/ and commits it.
# Run from the Actions tab (or `gh workflow run fetch-assets.yml -f files="File_A.webm|File_B.jpg" -f dest=assets/footage`).
on:
  push:
    paths: ["assets/fetch-list.txt"]      # push a list (one "dest|File_name" per line) to trigger a fetch
  workflow_dispatch:
    inputs:
      files: { description: "Commons file names separated by | (spaces as underscores)", required: true }
      dest:  { description: "Folder to save into", required: true, default: "assets/footage" }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - name: Download from Wikimedia Commons
        env:
          FILES: ${{ inputs.files }}
          DEST_IN: ${{ inputs.dest }}
        run: |
          if [ -n "$FILES" ]; then IFS='|' read -ra L <<< "$FILES"; for N in "${L[@]}"; do echo "$DEST_IN|$N"; done > /tmp/list
          else grep -v '^#' assets/fetch-list.txt | sed '/^\s*$/d' > /tmp/list; fi
          # "search|dest|query|max" lines: search Commons (files only) and turn the hits into download lines
          grep '^search|' /tmp/list > /tmp/search || true; grep -v '^search|' /tmp/list > /tmp/list2 || true
          while IFS='|' read -r _ DEST Q MAX; do
            sleep 3
            curl -sS -A "autostudio-asset-fetch/1.0 (GitHub Actions)" -G "https://commons.wikimedia.org/w/api.php" \
              --data-urlencode action=query --data-urlencode list=search --data-urlencode srnamespace=6 \
              --data-urlencode "srsearch=$Q" --data-urlencode "srlimit=${MAX:-5}" --data-urlencode format=json \
              | python3 -c "import json,sys; [print(r['title'][5:].replace(' ','_')) for r in json.load(sys.stdin)['query']['search']]" \
              | while read -r T; do echo "$DEST|$T"; done >> /tmp/list2
          done < /tmp/search
          mv /tmp/list2 /tmp/list; echo "--- files to fetch:"; cat /tmp/list
          # also save each file's licence + author so credits are never guessed
          touch assets/LICENSES_fetched.txt
          while IFS='|' read -r DEST N; do
            grep -q "^$N | [^|]*[A-Za-z]" assets/LICENSES_fetched.txt && continue      # licence already recorded
            for try in 1 2 3; do
            sleep $((try * 8))
            curl -sS -A "autostudio-asset-fetch/1.0 (GitHub Actions)" -G "https://commons.wikimedia.org/w/api.php" \
              --data-urlencode action=query --data-urlencode "titles=File:$N" --data-urlencode prop=imageinfo \
              --data-urlencode iiprop=extmetadata --data-urlencode format=json \
              | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin); p=list(d['query']['pages'].values())[0]; em=p.get('imageinfo',[{}])[0].get('extmetadata',{})
          g=lambda k: re.sub('<[^>]+>','',str(em.get(k,{}).get('value','')))[:300].replace('\n',' ')
          print(sys.argv[1]+' | '+g('LicenseShortName')+' | '+g('Artist')+' | '+g('ImageDescription')[:200])" "$N" > /tmp/lic && { cat /tmp/lic >> assets/LICENSES_fetched.txt; break; } || true
            done
          done < /tmp/list
          while IFS='|' read -r DEST N; do
            mkdir -p "$DEST"; [ -s "$DEST/$N" ] && { echo "have $N"; continue; }
            H=$(printf "%s" "$N" | md5sum | cut -c1-32)
            URL="https://upload.wikimedia.org/wikipedia/commons/${H:0:1}/${H:0:2}/$N"
            for i in 1 2 3 4; do
              code=$(curl -sS -L -A "autostudio-asset-fetch/1.0 (GitHub Actions)" -o "$DEST/$N" -w "%{http_code}" "$URL") && [ "$code" = "200" ] && break
              echo "try $i got $code"; sleep $((i * 20))
            done
            [ "$code" = "200" ] || { echo "skipped (throttled): $N"; rm -f "$DEST/$N"; continue; }
            case "$N" in *.jpg|*.jpeg|*.png|*.tif)   # keep the repo light: cap huge images at 4096 px
              if [ "$(stat -c%s "$DEST/$N")" -gt 8000000 ]; then python3 -c "
          import sys; from PIL import Image; Image.MAX_IMAGE_PIXELS = None
          im = Image.open(sys.argv[1]); im.thumbnail((4096, 4096)); im.convert('RGB').save(sys.argv[1], quality=90)" "$DEST/$N"; fi ;; esac
            ls -la "$DEST/$N"
          done < /tmp/list
      - name: Commit
        run: |
          git config user.name "autostudio-bot"; git config user.email "bot@users.noreply.github.com"
          git add assets
          git commit -m "Fetch assets" || echo "nothing new"
          git push
