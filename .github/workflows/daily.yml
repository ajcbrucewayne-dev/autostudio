name: Daily videos
on:
  schedule:
    - cron: "17 4 * * *"   # every day 04:17 UTC; videos are scheduled for the next day
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with: { path: models, key: kokoro-v1 }
      - name: Download free voice model
        run: |
          mkdir -p models && cd models
          [ -f voices-v1.0.bin ] || curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          [ -f kokoro-v1.0.int8.onnx ] || curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
      - run: pip install -r requirements.txt
      - name: Make + upload videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_WHATIF: ${{ secrets.YT_REFRESH_TOKEN_WHATIF }}
          YT_REFRESH_TOKEN_SKITS: ${{ secrets.YT_REFRESH_TOKEN_SKITS }}
          YT_REFRESH_TOKEN_DARKHISTORY: ${{ secrets.YT_REFRESH_TOKEN_DARKHISTORY }}
          VIDEOS_PER_CHANNEL: ${{ vars.VIDEOS_PER_CHANNEL || '2' }}
        run: python engine/daily.py
      - name: Save videos (download for Instagram/TikTok)
        uses: actions/upload-artifact@v4
        with: { name: videos, path: "out/**/*.mp4", retention-days: 7 }
      - name: Remember used topics
        run: |
          git config user.name "autostudio-bot"; git config user.email "bot@users.noreply.github.com"
          git add state scripts && git commit -m "daily run" && git push || true
